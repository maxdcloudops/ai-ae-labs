<svg xmlns="http://www.w3.org/2000/svg" width="900" height="698" viewBox="0 0 900 698" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="900" height="698" fill="#f7f7f5"/><text x="28" y="34" font-size="20" font-weight="700" fill="#1f1f1d">Strict Schema Enforcer — що межа робить із невалідним викликом</text><text x="28" y="56" font-size="12" fill="#6b6b66">Валідний JSON ≠ валідний виклик. Кожен сценарій — реальний прогін через ту саму межу, що й справжні виклики моделі.</text><text x="28" y="74" font-size="12" font-weight="600" fill="#6b6b66">станом на 28.09.2026</text><rect x="28" y="96" width="844" height="342" rx="8" fill="#ffffff" stroke="#e3e3df"/><text x="44" y="120" font-size="13" font-weight="600" fill="#1f1f1d">Сценарії fault injection</text><text x="44" y="151" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">malformed-json</text><rect x="214" y="138" width="86" height="17" rx="3" fill="#b4483c"/><text x="257" y="151" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REJECTED</text><text x="312" y="151" font-size="11" fill="#6b6b66">рівень JSON: текст обірваний · tool arguments are not valid for this contract: unex…</text><text x="44" y="177" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">wrong-type</text><rect x="214" y="164" width="86" height="17" rx="3" fill="#b4483c"/><text x="257" y="177" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REJECTED</text><text x="312" y="177" font-size="11" fill="#6b6b66">рівень схеми: число там, де рядок · tool arguments are not valid for this contract:…</text><text x="44" y="203" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">unknown-field</text><rect x="214" y="190" width="86" height="17" rx="3" fill="#b4483c"/><text x="257" y="203" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REJECTED</text><text x="312" y="203" font-size="11" fill="#6b6b66">рівень схеми: поле, якого немає в контракті · tool arguments are not valid for this…</text><text x="44" y="229" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">missing-field</text><rect x="214" y="216" width="86" height="17" rx="3" fill="#b4483c"/><text x="257" y="229" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REJECTED</text><text x="312" y="229" font-size="11" fill="#6b6b66">рівень схеми: обов&#39;язкове поле відсутнє · arguments cannot be repaired safely: fiel…</text><text x="44" y="255" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">bad-code-shape</text><rect x="214" y="242" width="86" height="17" rx="3" fill="#b4483c"/><text x="257" y="255" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REJECTED</text><text x="312" y="255" font-size="11" fill="#6b6b66">рівень домену: валідний JSON, невалідний код · arguments cannot be repaired safely:…</text><text x="44" y="281" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">unknown-currency</text><rect x="214" y="268" width="86" height="17" rx="3" fill="#b4483c"/><text x="257" y="281" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REJECTED</text><text x="312" y="281" font-size="11" fill="#6b6b66">рівень домену: форма правильна, валюти немає · unknown currency code: XQZ is not pu…</text><text x="44" y="307" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">lowercase</text><rect x="214" y="294" width="86" height="17" rx="3" fill="#4a7c59"/><text x="257" y="307" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">ACCEPTED</text><text x="312" y="307" font-size="11" fill="#6b6b66">нормалізація: регістр — не помилка · пройшов усі рівні: base=USD target=UAH history…</text><text x="44" y="333" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">alias</text><rect x="214" y="320" width="86" height="17" rx="3" fill="#c4913a"/><text x="257" y="333" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REPAIRED</text><text x="312" y="333" font-size="11" fill="#6b6b66">ремонт: однозначний синонім валюти · base: resolved alias &#34;євро&#34; → &#34;EUR&#34; → base=EUR…</text><text x="44" y="359" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">ambiguous-alias</text><rect x="214" y="346" width="86" height="17" rx="3" fill="#b4483c"/><text x="257" y="359" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REJECTED</text><text x="312" y="359" font-size="11" fill="#6b6b66">домен: «долар» — їх багато, ремонт НЕБЕЗПЕЧНИЙ · arguments cannot be repaired safel…</text><text x="44" y="385" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">range-overflow</text><rect x="214" y="372" width="86" height="17" rx="3" fill="#c4913a"/><text x="257" y="385" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">REPAIRED</text><text x="312" y="385" font-size="11" fill="#6b6b66">ремонт: діапазон підрізається до стелі · history_days: clamped 365 → 14 → base=USD …</text><text x="44" y="411" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f1f1d">happy-path</text><rect x="214" y="398" width="86" height="17" rx="3" fill="#4a7c59"/><text x="257" y="411" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">ACCEPTED</text><text x="312" y="411" font-size="11" fill="#6b6b66">контроль: валідний виклик мусить пройти · пройшов усі рівні: base=USD target=UAH hi…</text><rect x="28" y="462" width="844" height="158" rx="8" fill="#ffffff" stroke="#e3e3df"/><text x="44" y="486" font-size="13" font-weight="600" fill="#1f1f1d">На якому рівні спіймано — і скільки</text><text x="44" y="515" font-size="11" fill="#1f1f1d">1. decode — чи це взагалі наш контракт</text><rect x="364" y="502" width="484" height="16" rx="2" fill="#8a8a84"/><text x="854" y="515" font-size="10" fill="#6b6b66">3</text><text x="44" y="541" font-size="11" fill="#1f1f1d">2. validate — чи правильна ФОРМА аргументів</text><rect x="364" y="528" width="484" height="16" rx="2" fill="#8a8a84"/><text x="854" y="541" font-size="10" fill="#6b6b66">3</text><text x="44" y="567" font-size="11" fill="#1f1f1d">3. repair — чи можна виправити БЕЗПЕЧНО</text><rect x="364" y="554" width="322" height="16" rx="2" fill="#8a8a84"/><text x="692" y="567" font-size="10" fill="#6b6b66">2</text><text x="44" y="593" font-size="11" fill="#1f1f1d">4. lookup — чи існує це в джерелі</text><rect x="364" y="580" width="484" height="16" rx="2" fill="#8a8a84"/><text x="854" y="593" font-size="10" fill="#6b6b66">3</text><rect x="28" y="636" width="10" height="10" rx="2" fill="#b4483c"/><text x="44" y="645" font-size="11" fill="#6b6b66">rejected — виклик не пройшов: модель отримує конкретну помилку й виправляє САМА</text><rect x="28" y="654" width="10" height="10" rx="2" fill="#c4913a"/><text x="44" y="663" font-size="11" fill="#6b6b66">repaired — виправлено безпечно (регістр, синонім, підрізаний діапазон); ремонт видно у відповіді</text><rect x="28" y="672" width="10" height="10" rx="2" fill="#4a7c59"/><text x="44" y="681" font-size="11" fill="#6b6b66">accepted — валідний із першої спроби</text></svg>