# Скан секретів: дві різні перевірки з різною роллю.
#
# ++ Advanced до ДЗ 1. Pre-commit хук (.githooks/pre-commit) ловить лише те, що
# комітиться зараз, і цього недостатньо з трьох причин:
#
#   1. хук обходиться одним прапорцем — `git commit --no-verify`;
#   2. хук нічого не знає про коміти, зроблені ДО його встановлення;
#   3. хук вмикається через `git config core.hooksPath`, а `.git/config` у git
#      не зберігається: файл хука приїде з клоном, а увімкнення — ні.
#
# Чому робіт дві, а не одна.
#
# Перший прогін цього workflow впав — і впав по суті: у git-історії курсового
# репозиторію лежить захардкоджений приймальний ключ agentgateway (коміти
# 114197b, 6a75145, 7d7694a від 21.09.2026, автор — апстрім курсу). Прибрати
# його звідти я не можу: це чужа історія, вона вже в клонах і в кеші GitHub.
#
# Спокуса тут очевидна — дописати allowlist, щоб «стало зелено». Це рівно те,
# від чого застерігає коментар у .gitleaks.toml цього ж репозиторію: allowlist,
# доданий заради зеленого CI, — це те, як пізніше комітять справжній ключ. До
# того ж baseline за SHA виявився крихким: локально в мене було 17 комітів і
# дві знахідки, у CI на повному форку — 36 комітів і три.
#
# Тому перевірки розділено за ВІДПОВІДАЛЬНІСТЮ:
#
#   working-tree — блокуюча. Відповідає за те, що в КОДІ, який ми пишемо,
#                  секретів немає. Це те, за що відповідаю я.
#   history      — інформаційна (continue-on-error). Показує успадкований борг,
#                  не блокуючи роботу. Стане блокуючою, коли ключ перевипустять.
#
# Постійно червоний CI нікого не захищає: його перестають читати за тиждень.
name: gitleaks

on:
  push:
  pull_request:
  # Щотижневий прогін ловить те, що вже в історії: правила gitleaks
  # оновлюються, і секрет, який минулого місяця не мав правила, цього вже має.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Блокуюча: у поточному стані репозиторію секретів бути не має.
  working-tree:
    name: Working tree (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-gitleaks
      # Чистий checkout у CI містить лише відстежувані файли, тому це скан
      # саме нашого коду. Локально та сама команда може спіймати ваш власний
      # demo/1_ai-gateway/.env: `gitleaks dir` не зважає на .gitignore.
      - run: gitleaks dir . --redact --verbose --exit-code 1

  # Інформаційна: успадковані знахідки в чужій історії.
  history:
    name: Full history (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 обов'язковий, а не косметичний: за замовчуванням
          # checkout тягне ОДИН коміт, і скан «усієї історії» тоді чесно
          # проходить по одному коміту — зелений CI, який нічого не перевірив.
          fetch-depth: 0
      - uses: ./.github/actions/install-gitleaks
      # `gitleaks git` — актуальна форма; `detect` приховано з v8.19.
      # --log-opts="--all" розгортає скан на ВСІ гілки й теги.
      - run: gitleaks git --log-opts="--all" --redact --verbose --exit-code 1
      - if: failure()
        run: |
          echo "::warning::Знахідки в успадкованій історії курсового репозиторію."
          echo "Це не регресія цього PR — див. коментар угорі цього workflow."
